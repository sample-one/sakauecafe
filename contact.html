    <body>
        <img src="images/right-top.webp" alt="画像" class="right-top">
        <img src="images/left-bottom.webp" alt="画像" class="left-bottom">

        <div class="cover-none">
            <header class="page-header wrapper">
                <h1 class="align-center">
                    <a href="index.html"><img class="logo" src="images/logo.svg" alt="坂上カフェ ホーム"></a>
                </h1>
                <nav>
                        <ul class="main-nav font-english">
                            <li><a href="news.html">News</a></li>
                            <li><a href="menu.html">Menu</a></li>
                            <li><a href="contact.html">Contact</a></li>
                            <li><a href="access.html">Access</a></li>
                        </ul>
                    <div id="side-id" class="side-menu">
                        <ul class="font-english">
                            <li><a href="news.html">News</a></li>

                            <li><a href="contact.html">Contact</a></li>

                        </ul>
                    </div>
                </nav>
            </header>
            <h2 class="page-title font-english">Contact</h2>
        </div>


    <div class="contact-form">
        <div class="form-header">
            <h3>お問い合わせ</h3>
            <p>ご質問やご要望がございましたら、お気軽にお問い合わせください。</p>
        </div>

    <form id="contactForm">
        <div class="form-group">
            <label for="name" class="form-label">
            お名前 <span class="required">*</span>
            </label>
            <input type="text" class="form-control" id="name" name="name" required maxlength="50">
        </div>

        <div class="form-group">
            <label for="email" class="form-label">
            メールアドレス <span class="required">*</span>
        </label>
            <input type="email" class="form-control" id="email" name="email" required maxlength="100">
        </div>

        <div class="form-group">
            <label for="subject" class="form-label">
            件名 <span class="required">*</span>
        </label>
            <input type="text" class="form-control" id="subject" name="subject" required maxlength="100">
        </div>

        <div class="form-group">
            <label for="message" class="form-label">
            メッセージ <span class="required">*</span>
        </label>
            <textarea class="form-control" id="message" name="message" rows="5" required maxlength="1000"></textarea>
        </div>

        <button type="submit" class="btn-submit">
            送信する
        </button>
    </form>
</div>



 
        <footer class="page-footer">
            <h3 class="heading-large font-english">Information</h3>
                <table class="info">
                    <tr>
                        <th>住所</th>
                        <td>東京都中野区中央 X-X-XXX</td>
                    </tr>
                    <tr>
                        <th>電話</th>
                        <td>03-XXXX-XXXX</td>
                    </tr>
                    <tr>
                        <th>営業時間</th>
                        <td>11:00〜19:00</td>
                    </tr>
                    <tr>
                        <th>店休日</th>
                        <td>土曜・日曜</td>
                </tr>
                </table>

            <div class="copyright">
                <small>&copy; 2026 坂上カフェ</small>
            </div>
        </footer>
    </body>
    <script>
        // スクロール
        window.addEventListener('scroll', function() {
        const menu = document.getElementById('side-id');
  
        // 例: 300px以上スクロールしたら表示、それより上なら非表示
        if (window.scrollY > 1) {
        menu.classList.add('is-show');
        } else {
        menu.classList.remove('is-show');
        }
        });
    </script>
</html>
